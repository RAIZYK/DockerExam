server {
 listen 8080;
 server_name localhost;
 root /usr/share/nginx/html;
 index index.html;
 location / { try_files $uri $uri/ /index.html; }
 location /products { proxy_pass http://productapi:8000/products; }
 location /health { proxy_pass http://productapi:8000/health; }
 location /orders { proxy_pass http://orderapi:8000/orders; }
 location /admin/ { proxy_pass http://admin:8000/admin/; }
 location /filter { proxy_pass http://filter:8000/filter; }
 location /identity/ { proxy_pass http://identity:8000/; }
}
